<!DOCTYPE html>
<html lang="es">
<head>
 <link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>Mi Rutina</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#111;color:#f5f5f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;position:relative}
.b1,.b2,.b3{position:absolute;border-radius:50%;z-index:0}.b1{width:220px;height:220px;left:-60px;top:-50px;background:#fff}.b2{width:160px;height:160px;right:-30px;top:45%;background:#555}.b3{width:260px;height:260px;left:25%;bottom:-140px;background:#2a2a2a}
.card{position:relative;z-index:1;width:100%;max-width:360px;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:22px 18px;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.logo{width:56px;height:56px;border-radius:12px;background:#000;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;letter-spacing:.02em;margin-bottom:14px}
h1{font-size:1.3rem;margin:0 0 4px}p{margin:0 0 14px;color:#bbb;font-size:.9rem}
label{display:block;font-size:.8rem;color:#bbb;margin-bottom:4px}
input[type=password]{width:100%;min-height:46px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font:inherit;padding:10px 12px}
input:focus,button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:.85rem;color:#ddd}
.row input{width:18px;height:18px}
button{width:100%;min-height:46px;border:0;border-radius:8px;background:#fff;color:#000;font:700 .95rem system-ui,sans-serif;cursor:pointer}
button.ghost{background:none;color:#fff;border:1px solid rgba(255,255,255,.35);margin-top:10px}
#msg{min-height:1.3em;margin:10px 0 0;font-size:.85rem;color:#ff9a9a}
</style>
</head>
<body>
<span class="b1"></span><span class="b2"></span><span class="b3"></span>
<form class="card" id="f" autocomplete="off">
 <div class="logo" aria-hidden="true">MR</div>
 <h1>Mi Rutina</h1>
 <p>Escribe tu contraseña para abrir la app.</p>
 <label for="pw">Contraseña</label>
 <input id="pw" type="password" autocomplete="current-password" required>
 <div class="row"><input id="rem" type="checkbox"><label for="rem" style="margin:0;font-size:.85rem;color:#ddd">Recordar en este teléfono</label></div>
 <button type="submit" id="go">Abrir</button>
 <button type="button" class="ghost" id="inst" hidden>Instalar en pantalla de inicio</button>
 <p id="msg" role="status"></p>
</form>

function b64(u){ var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
